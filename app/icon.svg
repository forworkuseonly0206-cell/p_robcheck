<!-- app/icon.svg - This will be automatically used by Next.js as favicon -->
<svg width="32" height="32" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background for better visibility -->
  <rect width="36" height="36" fill="#09090b" rx="6"/>
  
  <!-- Baseline -->
  <line 
    x1="4" 
    y1="24" 
    x2="32" 
    y2="24" 
    stroke="#10b981" 
    stroke-opacity="0.2"
    stroke-width="1"
    stroke-dasharray="2 2"
  />
  
  <!-- The pulse wave flowing into checkmark -->
  <path
    d="M 4 24 L 8 24 Q 10 24 11 20 L 13 12 L 15 28 L 17 22 Q 18 20 20 20 L 28 8"
    stroke="url(#pulse-gradient)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  
  <!-- Checkmark resolution -->
  <path
    d="M 16 22 L 18 24 L 22 18"
    stroke="#06b6d4"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  
  <!-- Scan points -->
  <circle cx="11" cy="20" r="1.5" fill="#10b981"/>
  <circle cx="20" cy="20" r="1.5" fill="#06b6d4" opacity="0.6"/>
  
  <defs>
    <linearGradient id="pulse-gradient" x1="4" y1="24" x2="28" y2="8">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
</svg>